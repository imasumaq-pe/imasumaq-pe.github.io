  var larga = function (s) { var p = String(s || '').slice(0, 10).split('-'), d = new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); return DL[d.getDay()] + ' ' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); };
  var out = [];
  usos.forEach(function (a) {
    if (a.estado === 'Entregado') out.push('La tiene ' + a.clienta + ' (' + a.id + '), la devuelve el ' + larga(a.pactada) + '. Primero recibe la devolución.');

  });
  return out;
}

const activa = c => c.estado !== 'Eliminada';
// Por qué no se puede quitar a una clienta de la lista. Misma función en la app y en el servidor.
// alqs: sus alquileres { id, estado, saldo, mora, desgaste, garantia, garantiaDevuelta }; nombresDe(id) → "Vestido rojo, Zapatos"
function pendientesClienta(alqs, nombresDe) {
  var S = function (n) { n = Math.round(Math.abs(Number(n || 0)) * 100) / 100; return 'S/ ' + (n % 1 ? n.toFixed(2) : String(n)); };
  var out = [];
  alqs.forEach(function (a) {
    if (a.estado === 'Anulado') return;
    if (a.estado === 'Entregado') out.push('Tiene prendas en alquiler: ' + nombresDe(a.id) + ' (' + a.id + '). Primero recibe la devolución.');
    else if (a.estado === 'Reservado') out.push('Tiene una reserva pendiente: ' + nombresDe(a.id) + ' (' + a.id + '). Entrégala o anúlala primero.');
    var saldo = Number(a.saldo || 0), mora = Number(a.mora || 0), dano = Number(a.desgaste || 0);
    if (saldo > 0.009) {
      var por = [];
      if (saldo > mora + dano + 0.009) por.push('alquiler');
      if (mora > 0.009) por.push('mora');
      if (dano > 0.009) por.push('daños');
      out.push('Te debe ' + S(saldo) + ' de ' + por.join(', ').replace(/, ([^,]*)$/, ' y $1') + ' (' + a.id + '). Primero regístrale el pago.');
    } else if (saldo < -0.009) out.push('Tú le debes devolver ' + S(saldo) + ' (' + a.id + ').');
    if (a.garantiaDevuelta === 'No' && a.garantia && a.garantia !== 'Ninguna' && a.estado !== 'Entregado' && a.estado !== 'Reservado')
      out.push('Todavía tienes su ' + (/dni/i.test(a.garantia) ? 'DNI' : 'documento') + ' guardado (' + a.id + '). Devuélveselo primero.');
  });
  return out;
}
function eliminarClientaUI(id) {
  const c = S.ix.cli[id]; if (!c) return;
  const falta = pendientesClienta(S.d.alquileres.filter(a => a.clientaId === id),
    aid => detDe(aid).filter(d => d.estado !== 'Devuelta').map(d => d.prenda).join(', ') || 'prendas');
  if (falta.length) {
    return modal(`<h2 style="margin-top:0;font-size:20px">Todavía no puedes eliminar a ${esc(nombre1(c.nombre))}</h2>
      ${falta.map(t => `<div class="warn" style="margin:8px 0">${esc(t)}</div>`).join('')}
      <button class="btn w" style="margin-top:14px" onclick="cerrarModal()">Entendido</button>`);
  }
  confirmar('¿Eliminar a ' + c.nombre + ' de tu lista?', 'Ya no saldrá en Clientas ni al buscar. Sus alquileres y pagos pasados se guardan. Si vuelve con el mismo DNI, reaparece sola.',
    () => guardar('eliminarClienta', [id], 'Clienta eliminada de la lista', () => ir('clientas', null, true)));
}

  const L = S.d.clientas.filter(c => (S.verElim ? !activa(c) : activa(c)) && (!t || norm([c.nombre, c.dni, c.telefono].join(' ')).indexOf(t) >= 0)).sort((x, y) => String(x.nombre).localeCompare(String(y.nombre)));
  const pieL = nElim ? `<button class="link" style="display:block;margin:12px 4px" onclick="S.verElim=${!S.verElim};pintarClientas()">${S.verElim ? '← Volver a mis clientas' : 'Ver eliminadas (' + nElim + ')'}</button>` : '';
  box.innerHTML = (S.verElim ? '<div class="mut" style="padding:8px 4px 0">Clientas eliminadas de la lista</div>' : '') + (L.length ? L.slice(0, 200).map(c => { const h = historialClienta(c.id);
    return `<div class="fila" onclick="ir('clienta',${q(c.id)})"><div class="tx"><div class="b">${esc(c.nombre)}</div><div class="mut">DNI ${esc(c.dni || '—')} · ${h.total} alquiler(es)</div></div>${h.debe > 0.009 ? `<div class="er-t b" style="flex:none">${money(h.debe)}</div>` : ''}</div>`; }).join('')
    : `<div class="empty">${S.verElim ? 'No hay clientas eliminadas.' : t ? 'No la encontré.' : 'Sin clientas. Se registran solas al alquilar.'}</div>`) + pieL;
}

    ${c.telefono ? `<div class="g2" style="margin-bottom:10px"><a class="btn2 w" href="https:\/\/wa.me/${telWa(c.telefono)}" target="_blank" rel="noopener">${ic('mensaje')} WhatsApp</a><a class="btn2 w" href="tel:${esc(c.telefono)}">${ic('telefono')} Llamar</a></div>` : ''}
    ${h.debe > 0.009 ? `<div class="note">Debe ${money(h.debe)} en total.</div>` : ''}${h.tarde ? `<div class="mut">Devolvió tarde ${h.tarde} vez/veces.</div>` : ''}${c.notas ? `<div class="card">${esc(c.notas)}</div>` : ''}
    <h2>Alquileres (${al.length})</h2><div class="card" style="padding:4px 12px">${al.map(a => filaAlq(a)).join('') || '<div class="mut" style="padding:12px 4px">Todavía no alquila.</div>'}</div>
    ${activa(c) ? `<button class="link" style="display:block;margin:18px auto 8px;color:var(--er)" onclick="eliminarClientaUI(${q(c.id)})">${ic('basura')} Eliminar de mi lista</button>` : ''}`;
}
function validarClienta(id) {
  const n = $('c-n').value.trim(), d = $('c-d').value.trim().replace(/\s/g, '');
  if (!n) { toast('Escribe el nombre.', true); return false; }
  if (errDni(d)) { toast(errDni(d), true); return false; }
  if (errCel($('c-t') && $('c-t').value)) { toast(errCel($('c-t').value), true); return false; }
  const otra = d && S.d.clientas.find(c => String(c.dni) === d && c.id !== id);
  if (otra) { toast('Ese DNI ya es de ' + otra.nombre + '.', true); return false; }
  return true;
}

async function instalarSinInternet(nueva) {
  if (navigator.onLine === false) { toast('Necesitas internet para sacar el link.', true); return; }
  cargando(true, '');
  try {
    const r = await llamar('linkAppSinInternet', !!nueva);
    S._linkApp = r.url;
    modal(`<h2 style="margin-top:0">Instalar la app sin internet</h2>
      <ol class="pasos"><li>Manda este link al equipo (tablet o celular) donde la quieres.</li>
      <li>Ábrelo allí en <b>Chrome</b> (con internet, solo esta vez).</li>
      <li>En el menú <b>⋮</b> toca <b>Instalar app</b> o <b>Agregar a la pantalla principal</b>.</li>
      <li>Listo: abre desde el ícono <b>ImaSumaq</b>, con o sin internet.</li></ol>
      <div class="note" style="background:var(--wabg);color:var(--wa)">${ic('alerta')} El link es como una llave de la tienda: mándalo solo a tus equipos.</div>
      <a class="btn wsp" style="margin-top:12px" href="${'https:\/\/wa.me/?text=' + encodeURIComponent(r.url)}" target="_blank" rel="noopener">${ic('mensaje')} Enviármelo por WhatsApp</a>
      <button class="btn2 w" style="margin-top:8px" onclick="copiarLinkApp()">Copiar link</button>
      <button class="lnk" style="margin-top:14px;color:var(--er)" onclick="confirmar('¿Cambiar la llave?', 'Los equipos que ya tienen la app instalada dejarán de conectarse hasta que abras el link nuevo en ellos. Úsalo si perdiste una tablet o celular.', () => instalarSinInternet(true))">Cambiar la llave (por si perdiste un equipo)</button>
      <button class="btn2 w" style="margin-top:12px" onclick="cerrarModal()">Cerrar</button>`);
  } catch (e) { toast(String(e && e.message || e).replace(/^(Error|Exception):\s*/, ''), true, 8000); }
  finally { cargando(false); }
}
function copiarLinkApp() {
  const t = S._linkApp || '';

  if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, () => prompt('Copia el link:', t)); else prompt('Copia el link:', t);
}
function guardarAjustes() {
  guardar('guardarConfig', [{ tema: S.temaPrev || cfg().tema || 'ciruela', negocio: $('a-n').value, mora_fija: Number($('a-m').value) || 0, dias_alquiler: parseInt($('a-d').value) || 0, recargo_dia: Math.max(0, Number($('a-r').value) || 0), hora_aviso: Math.min(23, Math.max(0, parseInt($('a-h').value) || 0)), correos_aviso: $('a-ca').value,
    indicaciones: $('a-i').value, mensaje_constancia: $('a-k').value, mensaje_recordatorio: $('a-w').value, correos_respaldo: $('a-c').value }], '✅ Ajustes guardados', () => ir('mas', null, true));
}

// ─────────── arranque y sincronización ───────────
async function refrescar() {
  if (S.ocupado || (S.cola && S.cola.length)) { if (S.cola && S.cola.length && !S.procesandoCola) procesarCola(); return; }
  try {
    const d = await llamar('getDatos');
    if (S.ocupado) return;
    setDatos(d);
    const enForm = !!S.form || !!S.edit || $('capa').innerHTML;
    const escribiendo = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!enForm && !escribiendo) { const y = window.scrollY; render(); window.scrollTo(0, y); }
    else if (!enForm && S.vista === 'lista') pintarResultados();
  } catch (e) { }
}
let tR;
window.addEventListener('resize', () => { clearTimeout(tR); tR = setTimeout(() => { if (S.vista === 'lista') pintarResultados(); }, 200); });
// Actualiza con lo que se haya hecho en otro equipo. Si la pantalla queda quieta 10 minutos deja de
// preguntar (ahorra batería y la cuota diaria de Google) y vuelve a actualizar apenas alguien la toca.
S.ultToque = Date.now(); S.ultRefresco = Date.now();
const activo = () => document.visibilityState === 'visible' && Date.now() - S.ultToque < 600000;
const refrescarSiToca = () => { S.ultRefresco = Date.now(); refrescar(); };
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  const dormida = Date.now() - S.ultToque >= 600000; S.ultToque = Date.now();
  if (dormida && Date.now() - S.ultRefresco > 45000) refrescarSiToca();
}, { passive: true }));
window.addEventListener('online', () => { S.colaEstado = ''; clearTimeout(colaTimer); if (S.cola.length) procesarCola(); else refrescarSiToca(); });
window.addEventListener('offline', () => { S.colaEstado = 'offline'; pintarEstadoCola(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.ultRefresco > 15000) refrescarSiToca(); });
setInterval(() => { if (activo()) refrescarSiToca(); }, 45000);
if (EN_SHEET) $('btn-cerrar').style.display = '';
try {
  // El "atrás" de la tablet/celular sigue el mismo camino que la flecha ← de la app.
  google.script.history.setChangeHandler(() => {
    const quedarse = () => { try { google.script.history.push({ v: S.vista, p: S.param }, null, S.vista); } catch (e) { } };
    if ($('capa').innerHTML) { cerrarModal(); quedarse(); return; }
    if (S.vista === 'nuevo' && S.form && F().paso > 1) { pasoAtras(); quedarse(); return; }
    if (S.vista === 'inicio') return;
    atras();
  });
} catch (e) { }
// Arranque rápido: 1) datos que vienen con la página, 2) copia guardada en el equipo, 3) servidor.
function vincularConLink() {
  const m = /k=([0-9a-f]{64})/.exec(($('vk').value || '').trim());
  if (!m) { toast('Ese no es el link de instalación completo. Cópialo otra vez desde Ajustes → App sin internet.', true, 8000); return; }
  try { localStorage.setItem('alq_clave', m[1]); } catch (e) { }
  location.reload();
}
(function arrancar() {
  let d0 = null;
  try { d0 = JSON.parse($('datos0').textContent); } catch (e) { d0 = null; }
  const conPendientes = () => { if (S.cola.length) { S.cola.forEach(x => { try { aplicarLocal(x); } catch (e) { } }); reindexar(); procesarCola(); } };
  if (d0 && d0.alquileres) { setDatos(d0); conPendientes(); ir(VISTA0, null, true); return; }
  let local = null;
  try { local = JSON.parse(localStorage.getItem('alq_datos') || 'null'); } catch (e) { local = null; }
  if (local && local.alquileres) { setDatos(local); conPendientes(); ir(VISTA0, null, true); refrescar(); return; }
  llamar('getDatos').then(d => { setDatos(d); conPendientes(); ir(VISTA0, null, true); }).catch(e => {
    const m = String(e && e.message || e);
    const sinLlave = /CLAVE/.test(m);
    const txt = sinLlave && window.ES_APP ? 'Este equipo todavía no está vinculado con la tienda. Pega abajo el link de instalación (en la app de Google: Más → Ajustes → App sin internet → Copiar link).'
      : sinLlave ? 'Este equipo todavía no está vinculado con la tienda. En la app de Google ve a Más → Ajustes → App sin internet y abre aquí el link de instalación.'
      : /networkerror|failed to fetch|sin conexi|load failed/i.test(m) || navigator.onLine === false ? 'La primera vez necesita internet para traer los datos. Conéctate un momento y toca Reintentar; después ya abre sin internet.' : m;
    const pegar = sinLlave && window.ES_APP ? `<div style="text-align:left;max-width:440px;margin:0 auto 14px"><label class="l" for="vk">Link de instalación</label><textarea id="vk" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Mantén presionado aquí y toca Pegar"></textarea>
      <button class="btn" style="margin-top:10px" onclick="vincularConLink()">Vincular este equipo</button></div>` : '';
    $('main').innerHTML = `<div class="empty"><p>No se pudo cargar.</p><p class="mut">${esc(txt)}</p>${pegar}<button class="btn2" onclick="location.reload()">Reintentar</button></div>`;
  });
})();
