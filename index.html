  if ('serviceWorker' in navigator) {
    var habiaVersion = !!navigator.serviceWorker.controller, recargada = false;

/* Cabecera: logo redondo de color + nombre siempre visible + estado con puntito */
html.ios.grad .top{background:rgba(21,19,20,.45);border-bottom:1px solid var(--sep)}
html.ios.grad .top h1{position:static;transform:none;opacity:1;text-align:left;max-width:none;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;padding-left:4px}
html.ios.grad .top h1::before{content:'';flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 3px,transparent 3.5px),linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 0 0 3px rgba(255,255,255,.06)}
html.ios.grad #estado-cola{background:transparent!important;color:var(--tx2)!important;font-weight:500;padding:5px 6px}
html.ios.grad #estado-cola .i{color:var(--pri)}
html.ios.grad .top .ib{color:var(--tx2)}
/* Títulos y etiquetas tipo píldora */
html.ios.grad .gran-titulo{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 2px 16px}
html.ios.grad .fecha-mini{display:inline-flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;color:var(--tx2);margin:6px 2px 4px}
html.ios.grad .fecha-mini::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pri)}
html.ios.grad h2,html.ios.grad .l,html.ios.grad .paso{display:inline-block;font-size:12.5px!important;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--pri)!important;background:var(--acbg);padding:6px 13px;border-radius:999px;border:0;margin:20px 0 10px}

html.ios.grad .h-hoy .card>.row:first-child h2{margin:0}
html.ios.grad .mut{color:var(--tx2)}
/* Tarjetas: oscuras translúcidas; la elegida, con borde de color */
html.ios.grad .card{background:transparent;padding:0!important;box-shadow:none!important;border-radius:0}
html.ios.grad .fila{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;margin:0 0 9px;padding:12px 14px;transition:border-color .2s ease,background-color .2s ease,transform .15s ease}

html.ios.grad .h-hoy .card>div[style*="border-top"]{border-top:1px solid var(--sep)!important;padding:12px 4px 0!important;color:var(--tx2)}

html.ios.grad .grande.pri .i{background:rgba(255,255,255,.22);color:#fff}

/* Barra lateral (computadora) más visible: marca, botón «Nuevo alquiler», íconos en cuadritos y la sección activa con degradado */

@media (min-width:900px){
 html.ios.grad .nav{width:248px;padding:18px 14px;gap:4px;background:linear-gradient(180deg,rgba(48,18,38,.82),rgba(22,15,20,.82));border-right:1px solid var(--bd);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

/* Lista por secciones con encabezado fijo (como los movimientos del banco) */
html.ios.grad .grupo{margin-bottom:6px}
html.ios.grad .grupo-cab{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:2;display:flex;align-items:center;gap:8px;padding:12px 4px 8px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);background:linear-gradient(180deg,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
html.ios.grad .grupo-cab b{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--relleno);color:var(--tx2);font-size:11.5px;letter-spacing:0}
html.ios.grad .g-atr .grupo-cab{color:var(--er)}html.ios.grad .g-atr .grupo-cab b{background:var(--erbg);color:var(--er)}
html.ios.grad .g-hoy .grupo-cab{color:var(--pri)}html.ios.grad .g-hoy .grupo-cab b{background:var(--acbg);color:var(--pri)}
html.ios.grad .g-fin .fila{opacity:.75}
@media (min-width:900px){html.ios.grad .grupo-cab{top:52px}}
@media (prefers-reduced-motion:reduce){html.ios.grad .luz{transition:opacity .2s ease,background-color .2s ease}}

// Paso 2: fechas
function ajustarVuelta(f) { if (f.nDias != null) f.pactada = sumar(f.salida, f.nDias); else if (f.pactada < f.salida) { f.pactada = f.salida; f.vueltaElegida = false; } }
function setSalida(v) { const f = F(); if (v === 'otra') { f.otraSalida = true; } else { f.otraSalida = false; f.salida = v; } ajustarVuelta(f); f.entregar = f.salida <= hoy(); render(); }

    const et = e === 'Atrasado' ? dias(a.pactada, h) + 'd tarde' : e === 'Entregado' ? 'vuelve ' + cuando(a.pactada) : e === 'Reservado' ? 'sale ' + cuando(a.salida) : '';
    (B[k] = B[k] || []).push(filaAlq(a, et));

  return G.filter(g => B[g[0]]).map(g => `<section class="grupo g-${g[0]}"><div class="grupo-cab"><span>${g[1]}</span><b>${B[g[0]].length}</b></div>${B[g[0]].join('')}</section>`).join('');

    var saldo = Number(a.saldo || 0), mora = Number(a.mora || 0), dano = Number(a.desgaste || 0);
    if (saldo > 0.009) {
      var por = [];
      if (saldo > mora + dano + 0.009) por.push('alquiler');
      if (mora > 0.009) por.push('mora');
      if (dano > 0.009) por.push('daños');
      out.push('Te debe ' + S(saldo) + ' de ' + por.join(', ').replace(/, ([^,]*)$/, ' y $1') + ' (' + a.id + '). Primero regístrale el pago.');
    } else if (saldo < -0.009) out.push('Tú le debes devolver ' + S(saldo) + ' (' + a.id + ').');
    if (a.garantiaDevuelta === 'No' && a.garantia && a.garantia !== 'Ninguna' && a.estado !== 'Entregado' && a.estado !== 'Reservado')
      out.push('Todavía tienes su ' + (/dni/i.test(a.garantia) ? 'DNI' : 'documento') + ' guardado (' + a.id + '). Devuélveselo primero.');
  });
  return out;
}

    ${c.telefono ? `<div class="g2" style="margin-bottom:10px"><a class="btn2 w" href="https:\/\/wa.me/${telWa(c.telefono)}" target="_blank" rel="noopener">${ic('mensaje')} WhatsApp</a><a class="btn2 w" href="tel:${esc(c.telefono)}">${ic('telefono')} Llamar</a></div>` : ''}

    <h2>Alquileres (${al.length})</h2><div class="card" style="padding:4px 12px">${al.map(a => filaAlq(a)).join('') || '<div class="mut" style="padding:12px 4px">Todavía no alquila.</div>'}</div>

function validarClienta(id) {

  if (errCel($('c-t') && $('c-t').value)) { toast(errCel($('c-t').value), true); return false; }

  if (otra) { toast('Ese DNI ya es de ' + otra.nombre + '.', true); return false; }
  return true;
}

function copiarLinkApp() {

function guardarAjustes() {

// ─────────── arranque y sincronización ───────────
async function refrescar() {
  if (S.ocupado || (S.cola && S.cola.length)) { if (S.cola && S.cola.length && !S.procesandoCola) procesarCola(); return; }
  try {
    const d = await llamar('getDatos');
    if (S.ocupado) return;
    setDatos(d); marcarSync();
    const enForm = !!S.form || !!S.edit || $('capa').innerHTML;
    const escribiendo = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (!enForm && !escribiendo) { const y = window.scrollY; render(); window.scrollTo(0, y); }
    else if (!enForm && S.vista === 'lista') pintarResultados();
  } catch (e) { if (esErrorDeRed(e)) { S.sinRed = true; pintarEstadoCola(); } }
}
let tR;
window.addEventListener('resize', () => { clearTimeout(tR); tR = setTimeout(() => { if (S.vista === 'lista') pintarResultados(); }, 200); });
// Actualiza con lo que se haya hecho en otro equipo. Si la pantalla queda quieta 10 minutos deja de
// preguntar (ahorra batería y la cuota diaria de Google) y vuelve a actualizar apenas alguien la toca.
S.ultToque = Date.now(); S.ultRefresco = Date.now();
const activo = () => document.visibilityState === 'visible' && Date.now() - S.ultToque < 600000;
const refrescarSiToca = () => { S.ultRefresco = Date.now(); refrescar(); };
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
  const dormida = Date.now() - S.ultToque >= 600000; S.ultToque = Date.now();
  if (dormida && Date.now() - S.ultRefresco > 45000) refrescarSiToca();
}, { passive: true }));
window.addEventListener('online', () => { S.colaEstado = ''; S.sinRed = false; pintarEstadoCola(); clearTimeout(colaTimer); if (S.cola.length) procesarCola(); else refrescarSiToca(); });
window.addEventListener('offline', () => { S.colaEstado = 'offline'; pintarEstadoCola(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.ultRefresco > 15000) refrescarSiToca(); });
setInterval(() => { if (activo()) refrescarSiToca(); }, 45000);
if (EN_SHEET) $('btn-cerrar').style.display = '';
try {
  // El "atrás" de la tablet/celular sigue el mismo camino que la flecha ← de la app.
  google.script.history.setChangeHandler(() => {
    const quedarse = () => { try { google.script.history.push({ v: S.vista, p: S.param }, null, S.vista); } catch (e) { } };
    if ($('capa').innerHTML) { cerrarModal(); quedarse(); return; }
    if (S.vista === 'nuevo' && S.form && F().paso > 1) { pasoAtras(); quedarse(); return; }
    if (S.vista === 'inicio') return;
    atras();
  });
} catch (e) { }
// Arranque rápido: 1) datos que vienen con la página, 2) copia guardada en el equipo, 3) servidor.
function desvincularEquipo() {
  if (S.cola.length) { toast('Hay ' + S.cola.length + ' cambio(s) sin enviar. Conéctate a internet y espera a que se guarden antes de desvincular.', true, 9000); return; }
  confirmar('¿Desvincular este equipo?', 'Se borran de este equipo la llave y la copia de los datos (en el Google Sheet no se borra nada). Úsalo si vas a vender o prestar la tablet o el celular.', () => {
    ['alq_clave', 'alq_datos', COLA_KEY].forEach(k => { try { localStorage.removeItem(k); } catch (e) { } });
    try { caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).finally(() => location.replace(location.pathname)); } catch (e) { location.replace(location.pathname); }
  });
}
function vincularConLink() {
  const m = /k=([0-9a-f]{64})/.exec(($('vk').value || '').trim());
  if (!m) { toast('Ese no es el link de instalación completo. Cópialo otra vez desde Ajustes → App sin internet.', true, 8000); return; }
  try { localStorage.setItem('alq_clave', m[1]); } catch (e) { }
  (S.cola || []).forEach(t => { if (/CLAVE/.test(t.error || '')) { t.error = ''; t.intentos = 0; } }); persistirCola();
  location.reload();
}
(function arrancar() {
  let d0 = null;
  try { d0 = JSON.parse($('datos0').textContent); } catch (e) { d0 = null; }
  const conPendientes = () => { if (S.cola.length) { S.cola.forEach(x => { try { aplicarLocal(x); } catch (e) { } }); reindexar(); procesarCola(); } };
  if (d0 && d0.alquileres) { setDatos(d0); marcarSync(); conPendientes(); ir(VISTA0, null, true); return; }
  let local = null;
  try { local = JSON.parse(localStorage.getItem('alq_datos') || 'null'); } catch (e) { local = null; }
  if (local && local.alquileres) { setDatos(local); conPendientes(); ir(VISTA0, null, true); refrescar(); return; }
  llamar('getDatos').then(d => { setDatos(d); marcarSync(); conPendientes(); ir(VISTA0, null, true); }).catch(e => {
    const m = String(e && e.message || e);
    const sinLlave = /CLAVE/.test(m);
    const txt = sinLlave && window.ES_APP ? 'Este equipo todavía no está vinculado con la tienda. Pega abajo el link de instalación (en la app de Google: Más → Ajustes → App sin internet → Copiar link).'
      : sinLlave ? 'Este equipo todavía no está vinculado con la tienda. En la app de Google ve a Más → Ajustes → App sin internet y abre aquí el link de instalación.'
      : /networkerror|failed to fetch|sin conexi|load failed/i.test(m) || navigator.onLine === false ? 'La primera vez necesita internet para traer los datos. Conéctate un momento y toca Reintentar; después ya abre sin internet.' : m;
    const pegar = sinLlave && window.ES_APP ? `<div style="text-align:left;max-width:440px;margin:0 auto 14px"><label class="l" for="vk">Link de instalación</label><textarea id="vk" rows="3" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Mantén presionado aquí y toca Pegar"></textarea>
      <button class="btn" style="margin-top:10px" onclick="vincularConLink()">Vincular este equipo</button></div>` : '';
    $('main').innerHTML = `<div class="empty"><p>No se pudo cargar.</p><p class="mut">${esc(txt)}</p>${pegar}<button class="btn2" onclick="location.reload()">Reintentar</button></div>`;
  });
})();
pintarEstadoCola();
// En computadora, con ventana grande, todo se agranda un poco (como Ctrl +) para que no se vea diminuto ni vacío.
function escalarPantalla() {
  const w = innerWidth, h = innerHeight, pc = matchMedia('(pointer:fine)').matches;
  const z = pc && w >= 1100 ? Math.max(1, Math.min(w / 1300, h / 780, 1.25)) : 1;
  const r = document.documentElement.style, zz = z > 1.02 ? z.toFixed(3) : '';
  r.zoom = zz; r.setProperty('--z', zz || '1');
}
escalarPantalla(); addEventListener('resize', () => { clearTimeout(S._tEsc); S._tEsc = setTimeout(escalarPantalla, 80); });
